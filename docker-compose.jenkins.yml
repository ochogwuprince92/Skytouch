services:
  jenkins:
    build: ./jenkins
    container_name: skytouch-jenkins
    privileged: true
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /run/podman/podman.sock:/var/run/podman.sock
    restart: unless-stopped

volumes:
  jenkins_home:
