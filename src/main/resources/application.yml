server:
  port: ${PORT}


spring:
  application:
    name: Skytouch
  profiles:
    active: prod

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /v3/api-docs
    disable-swagger-default-url: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

app:
  mail:
    brevo:
      api-key: ${BREVO_API_KEY}
      api-url: ${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
      sender-name: ${BREVO_SENDER_NAME:SkyTouch}
  jwt:
    secret: ${JWT_SECRET}
  admin:
    email: ${ADMIN_EMAIL}
    default-password: ${ADMIN_PASSWORD}
  auth:
    email-from: ${APP_EMAIL_FROM:${MAIL_USERNAME:noreply@skytouch.com}}
    log-otp: ${APP_LOG_OTP:true}
    mail-send-enabled: ${MAIL_SEND_ENABLED:true}
    otp:
      length: 6
      expiration-ms: 600000
      max-attempts: 5
    session:
      expiration-ms: 86400000
  storage:
    cloudinary-enabled: ${CLOUDINARY_ENABLED:false}
    local-upload-dir: ${LOCAL_UPLOAD_DIR:uploads}
  job-alert:
    digest:
      enabled: ${JOB_ALERT_DIGEST_ENABLED:true}
      cron: ${JOB_ALERT_DIGEST_CRON:0 0 8 * * *}
      lookback-hours: ${JOB_ALERT_DIGEST_LOOKBACK_HOURS:24}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

address:
  validation:
    enabled: ${ADDRESS_VALIDATION_ENABLED:false}
    api-key: ${GOOGLE_ADDRESS_API_KEY}
    endpoint: ${GOOGLE_ADDRESS_VALIDATION_ENDPOINT:https://maps.googleapis.com/maps/api/geocode/json}

paystack:
  secret-key: ${PAYSTACK_SECRET_KEY}
  public-key: ${PAYSTACK_PUBLIC_KEY}
  callback-url: ${PAYSTACK_CALLBACK_URL}
  webhook-url: ${PAYSTACK_WEBHOOK_URL}
  api-url: https://api.paystack.co
