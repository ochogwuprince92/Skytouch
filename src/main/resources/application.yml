
server:
  port: ${PORT:8083}

  spring:
  application:
    name: Skytouch
  profiles:
    active: local

  mail:
    host: smtp.gmail.com
    port: 587
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
