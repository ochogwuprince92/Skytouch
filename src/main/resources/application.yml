server:
  port: ${PORT:8083}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: Skytouch
  profiles:
    active: local

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    protocol: ${MAIL_PROTOCOL:smtp}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: ${MAIL_CONNECTION_TIMEOUT:30000}
          timeout: ${MAIL_TIMEOUT:30000}
          writetimeout: ${MAIL_WRITE_TIMEOUT:30000}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    url: /v3/api-docs
    disable-swagger-default-url: true

app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    email-from: ${APP_EMAIL_FROM:${MAIL_USERNAME:noreply@skytouch.com}}
    log-otp: ${APP_LOG_OTP:false}
    mail-send-enabled: ${MAIL_SEND_ENABLED:true}
    otp:
      length: 6
      expiration-ms: 600000
      max-attempts: 5
    session:
      expiration-ms: 86400000


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}