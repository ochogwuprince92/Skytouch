server:
  port: ${PORT:8083}

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: Skytouch
  profiles:
    active: local

  mail:
    host: smtp.gmail.com
    port: 587
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
#
#springdoc:
#  api-docs:
#    enabled: true
#    path: /v3/api-docs
#  swagger-ui:
#    enabled: true
#    path: /swagger-ui.html
#    url: /v3/api-docs
#    disable-swagger-default-url: true

app:
  auth:
    email-from: ${APP_EMAIL_FROM:noreply@skytouch.com}
    otp:
      length: 6
      expiration-ms: 600000
      max-attempts: 5
    session:
      expiration-ms: 86400000
