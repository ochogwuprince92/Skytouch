spring:

  datasource:

    url: ${DATASOURCE_URL}

    username: ${DATASOURCE_USERNAME}

    password: ${DATASOURCE_PASSWORD}

    driver-class-name: org.postgresql.Driver

    hikari:

      maximum-pool-size: 2



  jpa:

    hibernate:

      ddl-auto: update

    show-sql: true

    database-platform: org.hibernate.dialect.PostgreSQLDialect



  flyway:

    enabled: false

    baseline-on-migrate: true

    baseline-version: 2

    locations: classpath:db/migration



  mail:

    username: ${MAIL_USERNAME}

    password: ${MAIL_PASSWORD}



app:
  jwt:
    secret: ${JWT_SECRET}
  auth:
    email-from: ${APP_EMAIL_FROM:${MAIL_USERNAME:noreply@skytouch.com}}
    log-otp: ${APP_LOG_OTP:true}
    mail-send-enabled: ${MAIL_SEND_ENABLED:true}
  frontend:
    url: ${APP_FRONTEND_URL}

  storage:
    cloudinary-enabled: ${CLOUDINARY_ENABLED:false}
    local-upload-dir: ${LOCAL_UPLOAD_DIR:uploads}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

address:
  validation:
    enabled: ${ADDRESS_VALIDATION_ENABLED:true}
    api-key: ${GOOGLE_ADDRESS_API_KEY:}
    endpoint: ${GOOGLE_ADDRESS_VALIDATION_ENDPOINT:https://maps.googleapis.com/maps/api/geocode/json}

logging:

  level:

    org:

      flywaydb: DEBUG

      springframework:

        security: DEBUG

      hibernate:

        orm:

          jdbc:

            bind: TRACE

    com:

      skytech:

        config: DEBUG

        root: INFO

