spring:

  datasource:

    url: ${DATASOURCE_URL}

    username: ${DATASOURCE_USERNAME}

    password: ${DATASOURCE_PASSWORD}

    driver-class-name: org.postgresql.Driver

    hikari:

      maximum-pool-size: 2



  jpa:

    hibernate:

      ddl-auto: update

    show-sql: true

    database-platform: org.hibernate.dialect.PostgreSQLDialect



  flyway:

    enabled: true

    baseline-on-migrate: true

    baseline-version: 0

    locations: classpath:db/migration



  mail:

    username: ${MAIL_USERNAME}

    password: ${MAIL_PASSWORD}



app:

  jwt:

    secret: ${JWT_SECRET}

  frontend:

    url: ${APP_FRONTEND_URL}



logging:

  level:

    org:

      flywaydb: DEBUG

      springframework:

        security: DEBUG

      hibernate:

        orm:

          jdbc:

            bind: TRACE

    com:

      skytech:

        config: DEBUG

        root: INFO

