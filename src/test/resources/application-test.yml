spring:
  datasource:
  url: ${DATASOURCE_URL}
  username: ${DATASOURCE_USERNAME}
  password: ${DATASOURCE_PASSWORD}
  driver-class-name: org.postgresql.Driver


  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: test@example.com
    password: test

cloudinary:
  cloud-name: test-cloud
  api-key: test-key
  api-secret: test-secret

app:
  jwt:
    secret: mySecretKeyForJWTTokenGenerationAndValidationPurposeOnly123456789012
  auth:
    email-from: noreply@skytouch.com
    log-otp: true
    mail-send-enabled: false
    otp:
      expiration-ms: 600000
      length: 6
      max-attempts: 5
    session:
      expiration-ms: 86400000
  job-alert:
    digest:
      enabled: false
  frontend:
    url: http://localhost:4173