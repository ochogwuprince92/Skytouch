spring:
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/skytouch_db}
    username: ${DATASOURCE_USERNAME:postgres}
    password: ${DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration

  mail:
    username: ${MAIL_USERNAME:test@example.com}
    password: ${MAIL_PASSWORD:test}

app:
  auth:
    email-from: ${APP_EMAIL_FROM:noreply@skytouch.com}
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:4174}
